<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#18241d" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Pradera — prototipo jugable</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="loading-screen" aria-live="polite">
      <section class="loading-card" aria-label="Carga del juego">
        <p class="loading-kicker">PRADERA</p>
        <h1>Preparando la villa</h1>
        <p id="loading-status">Preparando recursos</p>
        <div class="loading-track" aria-hidden="true">
          <div id="loading-progress"></div>
        </div>
        <p id="loading-percent">0%</p>
      </section>
    </main>

    <canvas
      id="game-canvas"
      class="is-loading"
      aria-label="Terreno de césped jugable"
    ></canvas>

    <aside id="debug-overlay" aria-label="Información de depuración">
      <div class="debug-heading">DEBUG</div>
      <div class="debug-row">
        <span>FPS</span>
        <strong id="debug-fps">--</strong>
      </div>
      <div class="debug-row">
        <span>RAM</span>
        <strong id="debug-memory">--</strong>
      </div>
      <div class="debug-row">
        <span>Entidades</span>
        <strong id="debug-entities">--</strong>
      </div>
      <div class="debug-row">
        <span>Objetos</span>
        <strong id="debug-objects">--</strong>
      </div>
      <div class="debug-detail">
        <span id="debug-object-detail">--</span>
        <span aria-hidden="true"> · </span>
        <span id="debug-particles">--</span> partículas
      </div>
    </aside>

    <script type="module" src="./main.js"></script>
  </body>
</html>
